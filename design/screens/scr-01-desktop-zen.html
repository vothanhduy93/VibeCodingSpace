<!-- Interactive Script for Micro-interactions (Timer & Fullscreen) -->
<script>
    let isRunning = false;
    let secondsLeft = 25 * 60;
    let timerInterval = null;

    const timerDisplay = document.getElementById('timer-display');
    const toggleBtn = document.getElementById('toggle-focus-btn');
    const toggleText = document.getElementById('toggle-focus-text');
    const resetBtn = document.getElementById('reset-focus-btn');
    const fullscreenBtn = document.getElementById('fullscreen-toggle-btn');

    function updateDisplay() {
      const mins = Math.floor(secondsLeft / 60);
      const secs = secondsLeft % 60;
      timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        toggleText.textContent = "Resume Focus";
        toggleBtn.querySelector('.material-symbols-outlined').textContent = "play_arrow";
      } else {
        isRunning = true;
        toggleText.textContent = "Pause";
        toggleBtn.querySelector('.material-symbols-outlined').textContent = "pause";
        timerInterval = setInterval(() => {
          if (secondsLeft > 0) {
            secondsLeft--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            toggleText.textContent = "Session Done";
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      secondsLeft = 25 * 60;
      updateDisplay();
      toggleText.textContent = "Start Focus";
      toggleBtn.querySelector('.material-symbols-outlined').textContent = "play_arrow";
    }

    toggleBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });
  </script>
