<!-- Micro-interactions & Functional Timer Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      let isRunning = false;
      let totalSeconds = 25 * 60;
      let timerInterval = null;

      const timerDisplay = document.getElementById('timer-display');
      const timerBtn = document.getElementById('timer-toggle-btn');
      const timerBtnText = document.getElementById('timer-btn-text');
      const resetBtn = document.getElementById('timer-reset-btn');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      const zenModeToggle = document.getElementById('zen-mode-toggle');

      function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      function updateClock() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const timeStr = `${hours}:${minutes}`;
        const headerTime = document.getElementById('header-time');
        if (headerTime) headerTime.textContent = timeStr;
      }
      setInterval(updateClock, 1000);
      updateClock();

      timerBtn.addEventListener('click', () => {
        if (!isRunning) {
          isRunning = true;
          timerBtnText.textContent = 'Pause';
          timerBtn.classList.remove('bg-primary');
          timerBtn.classList.add('bg-secondary', 'text-on-secondary');
          timerInterval = setInterval(() => {
            if (totalSeconds > 0) {
              totalSeconds--;
              timerDisplay.textContent = formatTime(totalSeconds);
            } else {
              clearInterval(timerInterval);
              isRunning = false;
              timerBtnText.textContent = 'Start Focus';
              timerBtn.classList.add('bg-primary');
              timerBtn.classList.remove('bg-secondary', 'text-on-secondary');
            }
          }, 1000);
        } else {
          isRunning = false;
          clearInterval(timerInterval);
          timerBtnText.textContent = 'Resume';
          timerBtn.classList.add('bg-primary');
          timerBtn.classList.remove('bg-secondary', 'text-on-secondary');
        }
      });

      resetBtn.addEventListener('click', () => {
        clearInterval(timerInterval);
        isRunning = false;
        totalSeconds = 25 * 60;
        timerDisplay.textContent = '25:00';
        timerBtnText.textContent = 'Start Focus';
        timerBtn.classList.add('bg-primary');
        timerBtn.classList.remove('bg-secondary', 'text-on-secondary');
      });

      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      let zenActive = false;
      zenModeToggle.addEventListener('click', () => {
        zenActive = !zenActive;
        const header = document.querySelector('header');
        const nav = document.querySelector('nav');
        if (zenActive) {
          header.classList.add('opacity-0', 'pointer-events-none');
          nav.classList.add('opacity-20', 'hover:opacity-100');
        } else {
          header.classList.remove('opacity-0', 'pointer-events-none');
          nav.classList.remove('opacity-20');
        }
      });
    });
  </script>
