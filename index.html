<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Personalized, minimalist, aesthetic Zen Focus Workspace with Pomodoro, Ambient Sounds, Lofi Player, and Daily Todos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VibeSpace" />
    <link rel="manifest" href="/manifest.json" />
    <title>VibeSpace — Zen Focus Workspace</title>
    
    <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-zen-body font-body antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          const basePath = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
          navigator.serviceWorker.register(basePath + 'sw.js').catch(err => {
            console.warn('PWA ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
